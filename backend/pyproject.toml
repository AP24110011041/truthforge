[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truthforge-backend"
version = "0.1.0"
description = "FastAPI backend foundation for TruthForge AI."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
ai = [
  "chromadb>=0.5.0",
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "sentence-transformers>=3.0.0"
]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
